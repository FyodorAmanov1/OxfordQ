[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-music-orchestrator"
version = "0.1.0"
description = "Motif-preserving orchestration of independent QML MIDI parts"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["mido>=1.3,<2", "music21>=9,<10", "pydantic>=2.8,<3", "google-genai>=1.55,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
quantum = ["qiskit==2.5.2"]

[project.scripts]
qml-orchestrate = "orchestrator.cli:main"
qml-orchestra = "quantum_models.orchestra:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "quantum_models*"]

[tool.setuptools.package-data]
quantum_models = ["data/*.json", "*.md", "IMPORT_MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
